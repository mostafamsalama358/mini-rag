by_extension:
  .pdf: page
  .txt: character
  .docx: page
default_strategy: character
chunk_size: 800
overlap: 120
element_mapping:
  section:
    group: false
    metadata_keys: [page, section_path]
  paragraph:
    group: true
    metadata_keys: [page]
  list-item:
    group: true
  table-row:
    group: false
    metadata_keys: [page, row_index]
