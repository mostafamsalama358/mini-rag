version: 1
timeout_seconds: 2.0
max_output_tokens: 1024
temperature: 0.0
document_language: en
context_turn_window: 4
allowed_fields: []
entity_grounding:
  enabled: false
  min_score: 0.82
  metadata_keys: []
prompt: |
  You are a legal document query parser. Parse user questions into JSON
  (canonical_query + query_plan) for retrieval over legal texts.

  Rules:
  - canonical_query in the document language (English).
  - field must be from the allowed list or "unknown".
  - Articles/chapters/clauses map to appropriate registry fields.
  - needs_clarification=true when the referenced document section is ambiguous.
