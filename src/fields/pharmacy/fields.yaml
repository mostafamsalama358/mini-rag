# Pharmacy field-concept registry (spec: generic field-aware retrieval).
#
# This file is the SINGLE declarative bridge between how users phrase a
# question and which column the answer lives in. It contains ONLY:
#   - canonical concepts users ask about (strengths, warnings, storage, ...)
#   - the surface forms (Arabic + English + abbreviations) that signal each
#   - per-concept output shape ("list" = name-only enumeration, "prose" = answer)
#   - optional column-header hints (last-resort field resolution)
#   - dataset-shape rules (entity / composition / interaction pairs) as data
#
# It contains NO regex intents, NO Python column names, NO special-case code.
# core/field_resolution.py matches a concept generically against the
# normalized query; retrieval filters on the resolved field generically.
# Adding a new field (e.g. "pediatric dose") is a YAML edit here, not code.

# Dataset-shape rules --------------------------------------------------------
# Which concept identifies a row (drug/product). When omitted, auto-detected.
entity_concept: product_name
# Which concept describes composition (for alternatives matching).
composition_concept: active_ingredient
# Column-header pairs that form an interaction edge. Data, not code: this
# replaces the hardcoded col_API1/col_API2 SQL in chunk_repository.py.
interaction_column_pairs:
  - [API1, API2]
  - [Drug A, Drug B]
  - [API, Interacting Substance]
# Optional explicit override for the entity column header. Leave null to
# auto-detect (most-unique mostly-alphabetic column).
entity_key_hint: null

# Concepts users ask about ---------------------------------------------------
concepts:
  - concept: product_name
    output_shape: list
    synonyms:
