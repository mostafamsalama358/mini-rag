# Pharmacy domain overrides for Retrieval Planner (spec 009).

available_strategies:
  - semantic
  - keyword
  - metadata
  - table
  - hybrid

default_strategy: semantic
clarification_confidence_threshold: 0.5
citation_required: true
diagnostics_enabled: false

strategy_mappings:
  factual:
    - semantic
    - hybrid
  list:
    - semantic
    - keyword
  comparative:
    - semantic
    - hybrid
  procedural:
    - semantic
    - keyword
  tabular:
    - table
    - semantic
  navigational:
    - metadata
    - keyword
  mixed:
    - hybrid
    - semantic
    - keyword

budget_defaults:
  factual:
    scope: narrow
    max_evidence_units: 5
    max_candidates: 20
  list:
    scope: standard
    max_evidence_units: 10
    max_candidates: 40
  comparative:
    scope: standard
    max_evidence_units: 8
    max_candidates: 30
  procedural:
    scope: standard
    max_evidence_units: 8
    max_candidates: 30
  tabular:
    scope: narrow
    max_evidence_units: 5
    max_candidates: 10
  navigational:
    scope: narrow
    max_evidence_units: 3
    max_candidates: 15
  mixed:
    scope: broad
    max_evidence_units: 15
    max_candidates: 60

entity_aliases:
  ASA: aspirin
  APAP: acetaminophen
  Ibu: ibuprofen

entity_type_patterns:
  - pattern: "ibuprofen|aspirin|acetaminophen|paracetamol|drug|medication"
    entity_type: drug
  - pattern: "dosage|dose|mg|ml"
    entity_type: dosage
  - pattern: "contraindication|warning|precaution"
    entity_type: contraindication
