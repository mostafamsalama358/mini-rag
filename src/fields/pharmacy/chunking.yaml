by_extension:
  .xlsx: row
  .csv: row
  .pdf: page
  .txt: character
default_strategy: character
chunk_size: 800
overlap: 120
element_mapping:
  table-row:
    group: false
    metadata_keys: [sheet_name, row_index]
  paragraph:
    group: true
  section:
    group: false
  list-item:
    group: true
