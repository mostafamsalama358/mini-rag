# User-to-project assignment mapping.
# The backend reads this to determine which projects each user can access.
# On startup, projects listed here are auto-created if they don't exist in DB.
#
# Structure:
#   users:
#     <user_id>:
#       - <domain_key>   # must match a key in registry.yaml / DomainKeyEnum
#
# Each domain in registry.yaml produces one project, named from its domain.yaml label.
# user_ids are stored in the projects.user_ids JSONB column on every sync.
version: 1

users:
  user123:
    - pharmacy
    - generic
    - legal
    - grc
    - madrsty
  admin456:
    - pharmacy
    - legal
    - generic
    - grc
    - madrsty
