version: 1
timeout_seconds: 25.0
max_output_tokens: 2048
temperature: 0.0
document_language: en
context_turn_window: 4
allowed_fields: []
entity_grounding:
  enabled: true
  min_score: 0.82
  metadata_keys: []
prompt: |
  You are a query understanding parser for a document retrieval system.
  Given a user question (possibly Arabic, English, or mixed), produce:
  1. canonical_query — a concise search string in the document language
  2. query_plan — structured intent for retrieval filters

  Rules:
  - Output ONLY valid JSON with keys canonical_query and query_plan.
  - field MUST be one of the allowed fields listed below, or "unknown".
  - operation: lookup (single fact), list (enumerate all), compare, explain, count, unsupported.
  - scope: all (exhaustive), single (one item), subset (partial list).
  - Carry forward current_entity when the user uses pronouns or follow-up references.
  - Set needs_clarification=true when the entity cannot be identified.
  - Never invent entity names not grounded in the question or session context.
