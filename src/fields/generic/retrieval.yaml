# Generic retrieval intents. Domain-specific patterns live in fields/{domain}/.
intents:
  detail:
    patterns:
      - "\\b(criteria|rules|procedures|requirements|list|items|steps|conditions|details|features|benefits|components)\\b"
      - "(ما\\s+(?:هي|هى)|اذكر|عدد|list|enumerate)"
    flags: "IGNORECASE"
  comparison:
    patterns:
      - "\\bdifference\\s+between\\b"
      - "\\bcompare\\b"
      - "\\bvs\\.?\\b"
    flags: "IGNORECASE"
  exhaustive_list:
    patterns:
      - "\\b(?:all|every)\\b.*\\b(?:conditions|requirements|items|criteria)\\b"
      - "(?:اذكر|عدد)\\s+(?:كل\\s+)?(?:شروط|بنود|عناصر)"
    flags: "IGNORECASE"
exhaustive_min_limit: 30
disable_chunk_focus: false
