# Generic field pack — Retrieval Planner configuration (spec 009).
# Domain packs (pharmacy, legal) may override any key.

available_strategies:
  - semantic
  - keyword
  - metadata
  - graph
  - document
  - section
  - table
  - hybrid
  - mixed

default_strategy: semantic
clarification_confidence_threshold: 0.5
citation_required: true
diagnostics_enabled: false
default_latency_budget_ms: null
default_cost_budget: null

budget_defaults:
  factual:
    scope: narrow
    max_evidence_units: 5
    max_candidates: 20
  list:
    scope: standard
    max_evidence_units: 10
    max_candidates: 40
  comparative:
    scope: standard
    max_evidence_units: 8
    max_candidates: 30
  procedural:
    scope: standard
    max_evidence_units: 8
    max_candidates: 30
  tabular:
    scope: narrow
    max_evidence_units: 3
    max_candidates: 10
  navigational:
    scope: narrow
    max_evidence_units: 3
    max_candidates: 15
  mixed:
    scope: broad
    max_evidence_units: 15
    max_candidates: 60

strategy_mappings:
  factual:
    - semantic
    - hybrid
  list:
    - semantic
    - keyword
  comparative:
    - semantic
    - hybrid
    - graph
  procedural:
    - semantic
    - document
  tabular:
    - table
    - semantic
  navigational:
    - metadata
    - document
  mixed:
    - hybrid
    - semantic
    - keyword

entity_aliases: {}
entity_type_patterns: []
