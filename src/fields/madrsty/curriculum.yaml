# Live answers_local tree.
# Countries → section → stage → grade id (classes.yaml).
# Units, lessons, and attachments stay in SQL Server. Upload them with
# unit_id, lesson_id, and attachment_id.
countries:
  - id: KW
    label: الكويت
    code: "+965"
    sections:
      - id: arabic_schools
        label: مدارس عربية
        stages:
          - id: primary
            label: ابتدائي
            grades: [G0, G1, G2, G3, G4, G5]
          - id: middle
            label: متوسط
            grades: [G6, G7, G8, G9]
          - id: secondary
            label: ثانوي
            grades: [G10, G11_SCI, G11_LIT, G12_SCI, G12_LIT, G12_REL]
      - id: university
        label: جامعي
        stages:
          - id: kuwait_university
            label: جامعة الكويت
            grades: [UNI_MED, UNI_PHARM]
          - id: aas_university
            label: جامعة عبد الله السالم
            grades: []
          - id: paaet_colleges
            label: كليات التطبيقي
            grades: [UNI_ENG]
          - id: paaet_institutes
            label: معاهد التطبيقي
            grades: [UNI_INST]
      - id: aptitude
        label: قدرات
        stages:
          - id: aptitude_english
            label: مادة انجليزي
            grades: [APT_EN]
          - id: aptitude_math
            label: مادة رياضيات
            grades: []
          - id: aptitude_chemistry
            label: في مادة الكيمياء
            grades: []
          - id: aptitude_arabic
            label: اللغة العربية
            grades: []
          - id: aptitude_french
            label: اللغة الفرنسية
            grades: []
      - id: ielts
        label: ielts
        stages:
          - id: british_council
            label: British council
            grades: []
          - id: idp
            label: IDP
            grades: []
  - id: EG
    label: مصر
    code: "+2"
    sections: []

semesters:
