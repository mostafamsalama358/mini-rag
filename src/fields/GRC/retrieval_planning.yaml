# GRC domain overrides for Retrieval Planner (spec 009).

available_strategies:
  - semantic
  - keyword
  - metadata
  - document
  - section
  - hybrid
  - mixed

default_strategy: semantic
clarification_confidence_threshold: 0.7
citation_required: true
diagnostics_enabled: false
max_evidence_units_ceiling: 8

strategy_mappings:
  factual:
    - semantic
    - hybrid
  list:
    - semantic
    - keyword
  comparative:
    - semantic
    - hybrid
  procedural:
    - semantic
    - document
  tabular:
    - semantic
    - document
  navigational:
    - metadata
    - document
  mixed:
    - hybrid
    - semantic
    - keyword

budget_defaults:
  factual:
    scope: narrow
    max_evidence_units: 5
    max_candidates: 20
  list:
    scope: standard
    max_evidence_units: 8
    max_candidates: 30
  comparative:
    scope: standard
    max_evidence_units: 8
    max_candidates: 30
  procedural:
    scope: standard
    max_evidence_units: 8
    max_candidates: 30
  tabular:
    scope: narrow
    max_evidence_units: 3
    max_candidates: 10
  navigational:
    scope: narrow
    max_evidence_units: 3
    max_candidates: 15
  mixed:
    scope: broad
    max_evidence_units: 8
    max_candidates: 40

entity_aliases:
  coso: COSO
  ifrs: IFRS
  ias: IAS
entity_type_patterns: []
