version: 1
timeout_seconds: 2.0
max_output_tokens: 1024
temperature: 0.0
document_language: ar
context_turn_window: 4
allowed_fields:
  - policy
  - requirement
  - tax_compliance
  - credit_policy
  - cutoff_integrity
  - fraud_detection
entity_grounding:
  enabled: false
  min_score: 0.82
  metadata_keys: []
prompt: |
  You are a GRC financial-audit query parser. Parse user questions or pasted
  transaction rows into JSON (canonical_query + query_plan) for retrieval over
  the internal financial bylaw (مواد اللائحة + RULE-* table).

  Rules:
  - canonical_query in Arabic when the bylaw/question is Arabic; else English.
  - field must be from the allowed list or "unknown".
  - Tax ID / VAT / إعفاءات → tax_compliance.
  - Due Date / Payment Status / Overdue → credit_policy.
  - Draft / Posting Date / cut-off / revenue recognition → cutoff_integrity.
  - Duplicate invoice / split / fraud → fraud_detection.
  - General bylaw / مادة / RULE- → policy or requirement.
  - needs_clarification=true when transaction columns needed for audit are missing.
